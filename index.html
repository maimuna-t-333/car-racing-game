<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Typing Racer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div>
    <h2>Typing Racer</h2>
    <button id="start-game" class="btn">Start Game</button>
  </div>

  <div class="container">
    <div class="track">
      <div id="car-1">
        <img src="car-1.png" alt="car-1" />
      </div>
      <div id="car-2">
        <img src="car-2.png" alt="car-2" />
      </div>
    </div>
    <div id="type-container">
      <div id="word-to-type">Get Started!</div>
      <input type="text" id="typed-id" placeholder="Type here..." />
    </div>
  </div>

  <dialog id="modal">
    <h3 id="result-text"></h3>
    <button onclick="location.reload()" class="btn">Play Again</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
